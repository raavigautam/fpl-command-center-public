    /* Price watch leads with what has not happened yet. A change already
     * banked is history; a change about to land is the only thing here you
     * can still act on, and it has a deadline of tonight. */
    function priceRows_(list) {
      var out = '';
      list.forEach(function (p) {
        out += '<div class="list-row"><span class="name">' + escapeHtml_(p.name) +
          ' <span class="meta">' + escapeHtml_(p.team + ' \u00b7 \u00a3' + p.price.toFixed(1) + 'm') +
          (p.alreadyMoved ? ' \u00b7 already moved this GW' : '') + '</span></span>' +
          '<span class="' + (p.direction === 'rise' ? 'delta-rise' : 'delta-fall') + '" title="' +
          p.net.toLocaleString() + ' net transfers, ' + Math.round(Math.abs(p.pressure) * 100) + '% of his owner base">' +
          escapeHtml_(p.label) + '</span></div>';
      });
      return out;
    }

    function sectionPriceAndRisk(data) {
      var html = '<section><div class="two-col">';
      html += '<div><div class="section-heading">Price watch</div>';
      var pw = data.priceWatch || {};
      var targets = pw.targets || [], mySquad = pw.squad || [], movers = pw.movers || [], settled = pw.settled || [];

      if (pw.urgent) {
        html += '<div class="urgent-price"><strong>' + escapeHtml_(pw.urgent.name) + '</strong> is a recommended buy and looks like rising before the next update. ' +
          'Buying tonight saves 0.1 \u2014 and you only ever bank half of a rise you missed.</div>';
      }

      if (targets.length) {
        html += '<div class="section-kicker">Players you have been told to buy</div>' + priceRows_(targets);
      }

        html += '<div class="section-kicker" style="margin-top:var(--space-3)">Your squad</div>' + priceRows_(mySquad);

        html += '<div class="section-kicker" style="margin-top:var(--space-3)">Elsewhere in the market</div>' + priceRows_(movers);
      }
      if (!targets.length && !mySquad.length && !movers.length) {
        html += '<p class="muted">Nothing under real price pressure right now.</p>';
      }

      if (settled.length) {
        html += '<div class="section-kicker" style="margin-top:var(--space-3)">Already settled this gameweek</div>';
        settled.forEach(function (p) {
          html += '<div class="list-row"><span class="name">' + escapeHtml_(p.name) + ' <span class="meta">' + escapeHtml_(p.team) + '</span></span>' +
            '<span class="' + (p.direction === 'rise' ? 'delta-rise' : 'delta-fall') + '">' +
            (p.direction === 'rise' ? '+' : '') + p.delta.toFixed(1) + 'm</span></div>';
        });
      }

      html += '<p class="caveat">FPL does not publish its price-change algorithm, so nothing here is a promise. ' +
        'What is measured is pressure: net transfers this gameweek set against the number of people who already own the player, ' +
        'because 60,000 net transfers into a 2%-owned punt and into a 45%-owned premium are not the same event. ' +
        'Counts run for the whole gameweek while prices change nightly, so anyone marked <em>already moved</em> has spent part of the momentum still showing in his numbers.</p>';
      html += '</div>';

      html += '<div><div class="section-heading">Injury &amp; rotation risk</div>';
      var rw = data.riskWatch || [];
      if (!rw.length) {
        html += '<p class="muted">No flagged players in your squad.</p>';

        // single least trustworthy string on the page.
        rw.forEach(function (p) {

            raw(h('span', { 'class': 'pill pill-hot', title: p.news || '' }, p.pill))

    function sectionMiniLeague(data) {

        leagues.forEach(function (l) {

    function sectionCompare(data) {
      var html = '<div>';

      // account has graded gameweeks of its own, those are shown instead —
      // a claim about THIS team beats a claim about a simulation, and it

      html += '<div class="stat-band">';

      } else {
        html += '<div><div class="stat-figure">+14.1%</div><div class="stat-label">Backtested vs. a static hold-GW1-squad baseline, full 2025-26 season</div></div>';

      }

      html += '<table class="table"><thead><tr><th></th><th>Official site</th><th>YouTube + Reddit</th><th>Your spreadsheet</th><th>Command Centre</th></tr></thead><tbody>' +
        compareRow_('Who to transfer', 'Raw stats only', 'Opinions, no your-squad context', 'Manual, time-consuming', 'Ranked, grounded in your squad') +
        compareRow_('When to chip', 'No guidance', 'Generic advice', 'You track it yourself', 'Tied to your clubs\' doubles/blanks') +
        compareRow_('Captain', 'Ownership %  only', 'Popularity contest', 'Gut feel', 'Expected points for this week\'s actual fixture, with the margin stated') +
        compareRow_('Who to start', 'Nothing', 'Nothing', 'Manual', 'Best legal XI by expected points, plus bench order') +
        compareRow_('Worth a hit?', 'No guidance', 'Opinions', 'Gut feel', 'Gain in points, compared against the −4') +
        compareRow_('Price moves', 'After the fact', 'Rumour threads', 'Not tracked', 'Tracked in your squad') +
        compareRow_('Injury risk', 'Status flag only', 'Scattered', 'Not tracked', 'Surfaced with the news') +
        compareRow_('Was it right?', 'No', 'No', 'Rarely revisited', 'Graded every week') +
        '</tbody></table>';
      html += '<p class="caveat">Honest caveat: captaincy is irreducibly high-variance, and being the outright top scorer is a tail event \u2014 ' +
        'even a model that picks perfectly on expectation only lands it about a quarter of the time, and picking at random from your eleven lands it around ' +
        (tr && tr.captainRandomBaseline != null ? tr.captainRandomBaseline + '%' : '9%') + '. That is why the first figure above is efficiency ' +
        '(the share of a perfect armband\u2019s points actually banked) rather than a hit rate' +
        ((tr && tr.captainEfficiency != null) ? ', and on your own team it is running at ' + tr.captainEfficiency + '%' : '') + '. ' +
        'The pick itself is chosen by simulating each candidate\u2019s scoring distribution against your league\u2019s real captains, so the percentage beside it ' +
        'is a simulated probability, not a margin of averages. Backtest figures elsewhere on this page predate several changes to the model \u2014 treat them as directional.</p>';
      html += '</div>';
      return html;
    }

    function compareRow_(job, a, b, c, d) {
      return '<tr><td>' + job + '</td><td>' + a + '</td><td>' + b + '</td><td>' + c + '</td><td>' + d + '</td></tr>';

    /* ===================== AI ASSISTANT ===================== */

    function sectionAi(data) {
      if (!data.hasAiKey) {
        return '<section class="ai-setup"><div class="section-heading">AI Assistant</div>' +
          '<p class="ruling-body" style="margin-bottom:var(--space-2)">Ask free-form questions about your squad and these suggestions — ' +
          '"why not captain Haaland instead?", "is my defense too thin?" — grounded in the real data above, not guesses. ' +
          'Also turns on a written weekly verdict instead of the rule-based one.</p>' +
          '<p class="muted" style="margin-bottom:var(--space-2)">Needs your own Anthropic API key (billed to you directly by Anthropic). ' +

          '<input type="password" id="aiKeyInput" placeholder="sk-ant-...">' +

          '<p class="error-text" id="aiKeyError"></p>' +
          '</section>';
      }
      return '<section><div class="section-heading">AI Assistant</div>' +
        '<p class="muted" style="font-size:13px;margin-bottom:var(--space-3)">Grounded in the squad above, and able to look things up: ' +
        'match-by-match history for any player in the game, your season gameweek by gameweek, your rivals&rsquo; squads, ' +
        'and the player pool by any criteria. It remembers the conversation between visits.</p>' +
        '<div class="chat-log" id="chatLog"></div>' +
        '<div class="chat-input-row">' +
        '<input type="text" id="chatInput" placeholder="Ask about your squad, or anyone in the game…" onkeydown="if(event.key===\'Enter\')sendChat();">' +
        '<button id="chatSendBtn" onclick="sendChat()">Ask</button>' +
        '</div>' +
        '<div class="error-text" id="chatError"></div>' +
        '<p class="muted" style="font-size:12px;margin-top:var(--space-2)">' +
        '<a href="#" onclick="clearChatClick(); return false;">Clear conversation</a> &middot; ' +
        '<a href="#" onclick="clearAiKeyClick(); return false;">Remove API key</a></p>' +
        '</section>';
    }

    var CHAT_PROMPTS = [
      'Has Semenyo started every game this season?',
      'Compare my two most expensive midfielders',
      'How has my season gone against the average?',
      'Who in my league owns players I do not?'
    ];

    function renderChatLog() {
      var log = document.getElementById('chatLog');
      if (!log) return;
      if (!STATE.chatHistory.length) {
        log.innerHTML = '<p class="muted">Ask anything about your squad, any player in the game, or how your season has gone. For example:</p>' +
          '<div class="chat-prompts">' + CHAT_PROMPTS.map(function (p) {
            return '<button class="chat-prompt" onclick="askPrompt_(this.textContent)">' + escapeHtml_(p) + '</button>';
          }).join('') + '</div>';
        return;
      }
      log.innerHTML = STATE.chatHistory.map(function (m) {
        // What the assistant looked up, shown above its answer. An assistant
        // that quietly fetches a match log and states the result reads as one
        // that made the number up; naming the lookup is what makes it
        // checkable.
        var tools = (m.toolsUsed || []).length
          ? '<div class="chat-tools">' + m.toolsUsed.map(function (t) {
              return '<span class="chat-tool">' + escapeHtml_(t) + '</span>';
            }).join('') + '</div>'
          : '';
        return '<div class="chat-msg ' + m.role + '"><span class="role">' + (m.role === 'user' ? 'You' : 'Command Centre') + '</span>' +
          tools + escapeHtml_(m.content).replace(/\n/g, '<br>') + '</div>';
      }).join('');
    }

    function askPrompt_(text) {
      var input = document.getElementById('chatInput');
      if (!input) return;
      input.value = text;
      sendChat();
    }

    /* The transcript lives on the server, so it survives the reload that a
     * Refresh, a team-id change or a deploy causes. Fetched once per load,
     * after the dashboard itself so it never delays the page. */
    function loadChatHistory_() {
      if (!(STATE.data && STATE.data.hasAiKey)) return;
      google.script.run
        .withSuccessHandler(function (history) {
          if (!history || !history.length) return;
          STATE.chatHistory = history;
          renderChatLog();
        })
        .withFailureHandler(function () { /* an empty transcript is not an error worth showing */ })
        .getChatHistory();
    }

    function clearChatClick() {
      STATE.chatHistory = [];
      renderChatLog();
      google.script.run.clearChatHistory();
    }

    function submitAiKey() {
      var val = document.getElementById('aiKeyInput').value;
      google.script.run.withSuccessHandler(function () { loadDashboard(); })
        .withFailureHandler(function (err) { document.getElementById('aiKeyError').textContent = err.message || err; })
        .saveAiKey(val);
    }

    function clearAiKeyClick() {
      STATE.chatHistory = [];
      google.script.run.withSuccessHandler(function () { loadDashboard(); }).clearAiKey();
    }

    function sendChat() {
      var input = document.getElementById('chatInput');
      var question = input.value.trim();
      if (!question) return;
      input.value = '';
      document.getElementById('chatError').textContent = '';
      document.getElementById('chatSendBtn').disabled = true;

      STATE.chatHistory.push({ role: 'user', content: question });
      renderChatLog();
      var log = document.getElementById('chatLog');
      // A tool-using turn can take several round trips, so the wait is long
      // enough to need saying something during. The label advances rather
      // than sitting on a static ellipsis.
      log.innerHTML += '<div class="chat-msg assistant" id="chatThinking"><span class="role">Command Centre</span>' +
        '<span id="chatThinkingText">Reading your squad…</span></div>';
      log.scrollTop = log.scrollHeight;
      startThinkingTicker_();

      google.script.run
        .withSuccessHandler(function (res) {
          stopThinkingTicker_();
          // The server returns {answer, toolsUsed}; a bare string means an
          // older deployment is still serving, so accept both.
          var answer = (res && res.answer) ? res.answer : String(res || '');
          STATE.chatHistory.push({ role: 'assistant', content: answer, toolsUsed: (res && res.toolsUsed) || [] });
          renderChatLog();
          document.getElementById('chatLog').scrollTop = document.getElementById('chatLog').scrollHeight;
          document.getElementById('chatSendBtn').disabled = false;
          // A transfer was recorded: the squad on the page is out of date.
          if (res && res.squadChanged) loadDashboard();
        })
        .withFailureHandler(function (err) {
          stopThinkingTicker_();
          document.getElementById('chatError').textContent = err.message || err;
          renderChatLog();
          document.getElementById('chatSendBtn').disabled = false;
        })
        .askAI(question);
    }

    var chatTicker = null;
    var CHAT_WAIT_STAGES = ['Reading your squad…', 'Looking things up…', 'Checking the numbers…', 'Writing…'];

    function startThinkingTicker_() {
      var i = 0;
      stopThinkingTicker_();
      chatTicker = setInterval(function () {
        i++;
        var el = document.getElementById('chatThinkingText');
        if (!el) { stopThinkingTicker_(); return; }
        el.textContent = CHAT_WAIT_STAGES[Math.min(i, CHAT_WAIT_STAGES.length - 1)];
      }, 3500);
    }

    function stopThinkingTicker_() {
      if (chatTicker) { clearInterval(chatTicker); chatTicker = null; }
    }


    /* ===================== COMMAND PALETTE =====================
     *
     * The dashboard answers a lot of questions, and the cost of each answer
     * is finding the section that holds it — scroll, open the right
     * <details>, read across a table. That is the right shape for reading
     * the week's verdict and the wrong shape for "what is Semenyo projecting
     * against Stach", which is a question with a two-line answer that a
     * manager wants without leaving where they are.
     *
     * So: Cmd+K (Ctrl+K elsewhere) opens a terminal over the page. Commands
     * that HAVE a short answer render it in place rather than navigating —
     * that is the whole point, and a palette that only ever scrolled you
     * somewhere would be a table of contents with extra steps. Commands that
     * do not, jump to the section and open it.
     *
     * Everything here reads STATE.data, which is already loaded. No command
     * costs a round trip except /ask, which is explicitly a question for the
     * assistant.
     */
    var PALETTE = { open: false, index: [], filtered: [], cursor: 0 };

    var PALETTE_COMMANDS = [
      { cmd: '/cap',     args: '',            label: 'The captain call, and the margin behind it', run: paletteCaptain_ },
      { cmd: '/compare', args: '<a> <b>',     label: 'Compare players side by side on the Ratings page', run: paletteCompare_ },
      { cmd: '/player',  args: '<name>',      label: 'One player in your squad, in full', run: palettePlayer_ },
      { cmd: '/eo',      args: '',            label: 'Effective ownership against your league', run: paletteEo_ },
      { cmd: '/plan',    args: '',            label: 'The multi-gameweek transfer plan', run: palettePlan_ },
      { cmd: '/price',   args: '',            label: 'What is about to rise or fall', run: palettePrice_ },
      { cmd: '/xi',      args: '',            label: 'The best legal starting eleven', run: paletteXi_ },
      { cmd: '/live',    args: '',            label: 'How this gameweek is going, right now', run: paletteLive_ },
      { cmd: '/do',      args: '',            label: 'Every decision for this gameweek', run: function () { return paletteJump_('Do now'); } },
      { cmd: '/ask',     args: '<question>',  label: 'Ask the assistant, grounded in your squad', run: paletteAsk_ },
      { cmd: '/refresh', args: '',            label: 'Reload live data from the FPL API', run: function () { closePalette(); loadDashboard(true); } }
    ];

    function isMac_() { return /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || ''); }

    function openPalette() {
      if (PALETTE.open) return;
      PALETTE.open = true;
      buildPaletteIndex_();
      var back = document.getElementById('paletteBackdrop');
      back.hidden = false;
      var input = document.getElementById('paletteInput');
      input.value = '';
      document.getElementById('paletteAnswer').hidden = true;
      filterPalette_('');
      input.focus();
    }

    function closePalette() {
      PALETTE.open = false;
      document.getElementById('paletteBackdrop').hidden = true;
    }

    /* Sections come from the rendered DOM rather than a hand-kept list, so a
     * section added to the page is reachable from the palette without anyone
     * remembering to register it. */
    function buildPaletteIndex_() {
      var index = [];

      PALETTE_COMMANDS.forEach(function (c) {
        index.push({ kind: 'command', cmd: c.cmd, args: c.args, label: c.label, hint: 'command',
          key: c.cmd + ' ' + c.label, run: c.run });
      });

      var seen = {};
      Array.prototype.forEach.call(document.querySelectorAll('#app .section-heading, #app .evi-title'), function (el) {
        // .evi-title carries its blurb in a nested span; the heading is the
        // first text node, not the whole textContent.
        var blurb = el.querySelector('.evi-blurb');
        var title = (blurb ? el.childNodes[0].textContent : el.textContent).trim();
        if (!title || seen[title.toLowerCase()]) return;
        seen[title.toLowerCase()] = true;
        index.push({ kind: 'section', label: title, hint: 'go to section', key: title, node: el });
      });

      var squad = (STATE.data && STATE.data.squad && STATE.data.squad.players) || [];
      squad.forEach(function (p) {
        index.push({
          kind: 'player', label: p.name,
          hint: p.position + ' · ' + p.team + ' · ' + (p.xp ? p.xp.next.toFixed(1) + ' xP' : '£' + p.price.toFixed(1) + 'm'),
          key: p.name + ' ' + p.team + ' ' + p.position, player: p
        });
      });

      PALETTE.index = index;
    }

    /* Subsequence matching, not substring: "smny" finds Semenyo, which is the
     * behaviour anyone who has used a palette expects. Ranked so an earlier
     * and tighter match wins. */
    function paletteScore_(haystack, needle) {
      if (!needle) return 1;
      var h = haystack.toLowerCase(), n = needle.toLowerCase();
      var exact = h.indexOf(n);
      if (exact === 0) return 1000;
      if (exact > 0) return 500 - exact;
      var hi = 0, first = -1, gaps = 0, last = -1;
      for (var i = 0; i < n.length; i++) {
        var c = n.charAt(i);
        if (c === ' ') continue;
        var at = h.indexOf(c, hi);
        if (at === -1) return 0;
        if (first === -1) first = at;
        if (last !== -1) gaps += at - last - 1;
        last = at;
        hi = at + 1;
      }
      return Math.max(1, 200 - first - gaps);
    }

    function filterPalette_(query) {
      var q = query.trim();
      var answer = document.getElementById('paletteAnswer');

      // A complete command with its arguments answers as you type — no Enter
      // needed for the read-only ones.
      var live = paletteLiveAnswer_(q);
      if (live) { answer.innerHTML = live; answer.hidden = false; }
      else { answer.hidden = true; }

      var pool = PALETTE.index;
      if (q.charAt(0) === '/') {
        var head = q.split(/\s+/)[0];
        pool = pool.filter(function (r) { return r.kind === 'command'; });
        PALETTE.filtered = pool.map(function (r) { return { r: r, s: paletteScore_(r.cmd, head) }; })
          .filter(function (x) { return x.s > 0; })
          .sort(function (a, b) { return b.s - a.s; })
          .map(function (x) { return x.r; });
      } else {
        PALETTE.filtered = pool.map(function (r) { return { r: r, s: paletteScore_(r.key, q) }; })
          .filter(function (x) { return x.s > 0; })
          .sort(function (a, b) { return b.s - a.s; })
          .slice(0, 12)
          .map(function (x) { return x.r; });
      }

      PALETTE.cursor = 0;
      renderPaletteResults_();
    }

    function renderPaletteResults_() {
      var box = document.getElementById('paletteResults');
      if (!PALETTE.filtered.length) {
        box.innerHTML = '<div class="palette-empty">Nothing matches. Type <code>/</code> to see every command.</div>';
        return;
      }
      box.innerHTML = PALETTE.filtered.map(function (r, i) {
        var left = r.kind === 'command'
          ? '<span class="pr-cmd">' + escapeHtml_(r.cmd + (r.args ? ' ' + r.args : '')) + '</span>'
          : '';
        return '<div class="palette-row" role="option" aria-selected="' + (i === PALETTE.cursor) + '" ' +
          'onmousemove="paletteCursor_(' + i + ')" onclick="paletteRun_(' + i + ')">' +
          left +
          '<span class="pr-label">' + escapeHtml_(r.label) + '</span>' +
          '<span class="pr-hint">' + escapeHtml_(r.hint) + '</span></div>';
      }).join('');
      var sel = box.children[PALETTE.cursor];
      if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: 'nearest' });
    }

    function paletteCursor_(i) {
      if (i === PALETTE.cursor) return;
      PALETTE.cursor = i;
      renderPaletteResults_();
    }

    function paletteRun_(i) {
      var row = PALETTE.filtered[i];
      if (!row) return;
      var input = document.getElementById('paletteInput');
      if (row.kind === 'command') {
        // A command needing arguments completes the input instead of running,
        // so Enter is never a dead keystroke.
        if (row.args && input.value.trim().split(/\s+/).length < 2) {
          input.value = row.cmd + ' ';
          filterPalette_(input.value);
          input.focus();
          return;
        }
        var out = row.run(paletteArgs_(input.value));
        if (out) { showPaletteAnswer_(out); }
        return;
      }
      if (row.kind === 'section') { paletteGoTo_(row.node); return; }
      if (row.kind === 'player') { showPaletteAnswer_(palettePlayerCard_(row.player)); return; }
    }

    function paletteArgs_(value) {
      var parts = value.trim().split(/\s+/);
      parts.shift();
      return parts.join(' ').trim();
    }

    /* Answers that can be computed from loaded data render as you type. /ask
     * and /compare are excluded: one costs a round trip and the other
     * navigates, so neither should fire on a keystroke. */
    function paletteLiveAnswer_(q) {
      if (q.charAt(0) !== '/') return null;
      var parts = q.trim().split(/\s+/);
      var head = parts[0];
      var rest = parts.slice(1).join(' ');
      var cmd = PALETTE_COMMANDS.filter(function (c) { return c.cmd === head; })[0];
      if (!cmd) return null;
      if (head === '/ask' || head === '/compare' || head === '/refresh' || head === '/do') return null;
      if (cmd.args && !rest) return null;
      try { return cmd.run(rest, true) || null; } catch (e) { return null; }
    }

    function showPaletteAnswer_(html) {
      var a = document.getElementById('paletteAnswer');
      a.innerHTML = html;
      a.hidden = false;
    }

    function paletteGoTo_(node) {
      closePalette();
      // The target may sit inside a collapsed evidence row; opening its
      // ancestor first means the scroll lands on content, not on a closed bar.
      var det = node.closest ? node.closest('details') : null;
      if (det) det.open = true;
      var target = det || node;
      if (target.scrollIntoView) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      target.classList.add('palette-landed');
      setTimeout(function () { target.classList.remove('palette-landed'); }, 1500);
    }

    function paletteJump_(title) {
      var row = PALETTE.index.filter(function (r) {
        return r.kind === 'section' && r.label.toLowerCase().indexOf(title.toLowerCase()) === 0;
      })[0];
      if (row) paletteGoTo_(row.node);
      else showPaletteAnswer_('<div class="pa-head">Not on this page</div><div>' + escapeHtml_(title) + ' has not rendered — the data behind it is missing this week.</div>');
      return null;
    }

    function paletteNoData_(what) {
      return '<div class="pa-head">' + escapeHtml_(what) + '</div>' +
        '<div class="pa-note">Not available this week — the data behind it has not loaded.</div>';
    }

    /* --- the answers --- */

    function paletteCaptain_() {
      var caps = (STATE.data && STATE.data.captainSuggestions) || [];
      if (!caps.length) return paletteNoData_('Captain');
      var html = '<div class="pa-head">Captain</div>';
      caps.slice(0, 4).forEach(function (c, i) {
        html += '<div class="pa-row"><span>' + (i === 0 ? '<strong>' : '') + escapeHtml_(c.name) + (i === 0 ? '</strong>' : '') +
          ' <span class="pr-hint">' + escapeHtml_(c.team + ' · ' + c.nextFixture) + '</span></span>' +
          '<span class="num">' + (c.topShare != null ? Math.round(c.topShare) + '% · ' : '') +
          (c.xp != null ? c.xp.toFixed(1) + ' xP' : 'form ' + c.form) + '</span></div>';
      });
      if (caps[0] && caps[0].topShare != null) {
        html += '<div class="pa-note">Percentages are the simulated chance of topping your eleven. ' +
          escapeHtml_(String(caps[0].confidence || 'Low')) + ' confidence' +
          (caps[0].beatFieldShare != null
            ? '; beats your league\u2019s captain ' + Math.round(caps[0].beatFieldShare) + '% of the time' : '') + '.' +
          (caps[0].disagreesWithMean ? ' ' + escapeHtml_(caps[0].disagreesWithMean.note) : '') + '</div>';
      } else if (caps[0] && caps[0].margin != null) {
        html += '<div class="pa-note">' + caps[0].margin.toFixed(1) + ' points clear of the next option — ' +
          escapeHtml_(String(caps[0].confidence).toLowerCase()) + ' confidence.</div>';
      }
      return html;
    }

    function palettePlayer_(name) {
      var p = paletteFindPlayer_(name);
      if (!p) return '<div class="pa-head">Player</div><div class="pa-note">No one in your squad matches &ldquo;' +
        escapeHtml_(name) + '&rdquo;. Use <code>/compare</code> to look up anyone in the game.</div>';
      return palettePlayerCard_(p);
    }

    function paletteFindPlayer_(name) {
      var squad = (STATE.data && STATE.data.squad && STATE.data.squad.players) || [];
      if (!name) return null;
      var scored = squad.map(function (p) { return { p: p, s: paletteScore_(p.name, name) }; })
        .filter(function (x) { return x.s > 0; })
        .sort(function (a, b) { return b.s - a.s; });
      return scored.length ? scored[0].p : null;
    }

    function palettePlayerCard_(p) {
      var html = '<div class="pa-head">' + escapeHtml_(p.name) + ' — ' + escapeHtml_(p.team + ' · ' + p.position) + '</div>';
      html += '<div class="pa-row"><span>Price</span><span class="num">£' + p.price.toFixed(1) + 'm</span></div>';
      if (p.xp) {
        html += '<div class="pa-row"><span>Expected points, this gameweek</span><span class="num">' + p.xp.next.toFixed(1) + '</span></div>';
        html += '<div class="pa-row"><span>Expected points, full horizon</span><span class="num">' + p.xp.horizon.toFixed(1) + '</span></div>';
      }
      html += '<div class="pa-row"><span>Form</span><span class="num">' + escapeHtml_(String(p.form)) + '</span></div>';
      if (p.selectedBy != null) html += '<div class="pa-row"><span>Owned by</span><span class="num">' + p.selectedBy.toFixed(1) + '%</span></div>';
      html += '<div class="pa-row"><span>In the eleven</span><span class="num">' +
        (p.isStarting ? (p.isCaptain ? 'Yes — captain' : 'Yes') : 'Benched') + '</span></div>';
      if (p.status && p.status !== 'a' && p.news) html += '<div class="pa-note">' + escapeHtml_(p.news) + '</div>';
      else if (p.reason) html += '<div class="pa-note">' + escapeHtml_(p.reason) + '</div>';
      return html;
    }

    function paletteEo_() {
      var e = STATE.data && STATE.data.leagueEo;
      if (!e) return paletteNoData_('Effective ownership');
      if (e.unavailable) return '<div class="pa-head">Effective ownership</div><div class="pa-note">' + escapeHtml_(e.unavailable) + '</div>';
      var html = '<div class="pa-head">Effective ownership — ' + escapeHtml_(e.leagueName) + '</div>';
      html += '<div class="pa-row"><span>Net exposure against the field</span><span class="num">' +
        (e.net >= 0 ? '+' : '') + e.net.toFixed(1) + ' pts</span></div>';
      (e.threats || []).slice(0, 4).forEach(function (r) {
        html += '<div class="pa-row"><span>' + escapeHtml_(r.name) + ' <span class="pr-hint">you do not own</span></span>' +
          '<span class="num">' + r.eo.toFixed(0) + '% EO · ' + r.delta.toFixed(1) + '</span></div>';
      });
      html += '<div class="pa-note">' + escapeHtml_(e.summary) + '</div>';
      return html;
    }

    function palettePlan_() {
      var r = STATE.data && STATE.data.roadmap;
      if (!r || !(r.weeks || []).length) return paletteNoData_('The plan');
      var html = '<div class="pa-head">The next ' + r.horizonGws + ' gameweeks</div>';
      r.weeks.forEach(function (w) {
        html += '<div class="pa-row"><span>GW' + w.event + ' <span class="pr-hint">' +
          (w.moves.length ? escapeHtml_(w.moves.map(function (m) { return m.inName + ' for ' + m.outName; }).join(', ')) : 'roll') +
          '</span></span><span class="num">' + (w.hits ? '−' + (w.hits * 4) : (w.moves.length ? 'free' : '+1 FT')) + '</span></div>';
      });
      if (r.divergence) html += '<div class="pa-note">' + escapeHtml_(r.divergence.summary) + '</div>';
      return html;
    }

    function palettePrice_() {
      var p = STATE.data && STATE.data.priceWatch;
      if (!p) return paletteNoData_('Price watch');
      var rows = (p.targets || []).concat(p.squad || []).concat(p.movers || []);
      if (!rows.length) return '<div class="pa-head">Price watch</div><div class="pa-note">Nothing under real price pressure right now.</div>';
      var html = '<div class="pa-head">Price pressure</div>';
      rows.slice(0, 6).forEach(function (r) {
        html += '<div class="pa-row"><span>' + escapeHtml_(r.name) + ' <span class="pr-hint">' + escapeHtml_(r.why) + '</span></span>' +
          '<span class="num">' + escapeHtml_(r.label) + '</span></div>';
      });
      if (p.urgent) html += '<div class="pa-note"><strong>' + escapeHtml_(p.urgent.name) + '</strong> is a recommended buy and looks like rising tonight.</div>';
      return html;
    }

    function paletteLive_() {
      var g = STATE.data && STATE.data.liveGameweek;
      if (!g) return '<div class="pa-head">Live</div><div class="pa-note">No gameweek in progress — the next deadline has not passed yet.</div>';
      var html = '<div class="pa-head">Gameweek ' + g.eventId + ' live</div>';
      html += '<div class="pa-row"><span>Points so far</span><span class="num">' + g.pointsSoFar +
        (g.average != null ? ' vs ' + g.average + ' avg' : '') + '</span></div>';
      html += '<div class="pa-row"><span>Still to come</span><span class="num">' +
        (g.playersYetToPlay + g.playersInPlay) + ' player' + ((g.playersYetToPlay + g.playersInPlay) === 1 ? '' : 's') + '</span></div>';
      if (g.captain) {
        html += '<div class="pa-row"><span>Captain ' + escapeHtml_(g.captain.name) + '</span>' +
          '<span class="num">' + g.captain.contributed + ' pts</span></div>';
      }
      html += '<div class="pa-row"><span>On the bench</span><span class="num">' + g.benchPoints + ' pts</span></div>';
      if (g.autosubsAvailable) html += '<div class="pa-note">Autosubs still to come — this score is not final.</div>';
      else if (g.complete) html += '<div class="pa-note">Every fixture done; final once bonus is confirmed.</div>';
      return html;
    }

    function paletteXi_() {
      var l = STATE.data && STATE.data.lineup;
      if (!l) return paletteNoData_('Best XI');
      var html = '<div class="pa-head">Best legal XI — ' + escapeHtml_(l.formation) + '</div>';
      html += '<div class="pa-row"><span>Projects</span><span class="num">' + l.projected + ' pts</span></div>';
      html += '<div class="pa-row"><span>Your current eleven</span><span class="num">' + l.currentProjected + ' pts</span></div>';
      (l.changes || []).forEach(function (c) {
        html += '<div class="pa-row"><span>Start ' + escapeHtml_(c.inName) + ' over ' + escapeHtml_(c.outName) + '</span>' +
          '<span class="num">+' + c.gain + '</span></div>';
      });
      if (!(l.changes || []).length) html += '<div class="pa-note">Your eleven is already the best legal one.</div>';
      return html;
    }

    /* Comparison is the Ratings page's job — it already lines up four players
     * and every component behind their scores. Deep-linking there beats
     * rebuilding a worse version of it in a 620px overlay. */
    function paletteCompare_(args) {
      var names = (args || '').split(/[\s,]+/).filter(Boolean);
      if (names.length < 1) return '<div class="pa-head">Compare</div><div class="pa-note">Name two players: <code>/compare Semenyo Stach</code></div>';
      closePalette();
      window.top.location.href = RATINGS_URL + '&compare=' + encodeURIComponent(names.slice(0, 4).join(','));
      return null;
    }

    function paletteAsk_(question) {
      if (!question) return '<div class="pa-head">Ask</div><div class="pa-note">Type a question after <code>/ask</code>.</div>';
      if (!(STATE.data && STATE.data.hasAiKey)) {
        return '<div class="pa-head">Ask</div><div class="pa-note">No AI key saved — add one in the AI Assistant section.</div>';
      }
      closePalette();
      var input = document.getElementById('chatInput');
      if (input) {
        input.value = question;
        var box = document.getElementById('chatLog');
        if (box && box.scrollIntoView) box.scrollIntoView({ behavior: 'smooth', block: 'center' });
        sendChat();
      }
      return null;
    }

    /* --- keyboard --- */

    document.addEventListener('keydown', function (e) {
      var key = String(e.key || '').toLowerCase();
      if ((e.metaKey || e.ctrlKey) && key === 'k') {
        e.preventDefault();
        PALETTE.open ? closePalette() : openPalette();
        return;
      }
      if (!PALETTE.open) return;
      if (key === 'escape') { e.preventDefault(); closePalette(); return; }
      if (key === 'arrowdown') {
        e.preventDefault();
        PALETTE.cursor = Math.min(PALETTE.cursor + 1, PALETTE.filtered.length - 1);
        renderPaletteResults_();
      } else if (key === 'arrowup') {
        e.preventDefault();
        PALETTE.cursor = Math.max(PALETTE.cursor - 1, 0);
        renderPaletteResults_();
      } else if (key === 'enter') {
        e.preventDefault();
        paletteRun_(PALETTE.cursor);
      }
    });

    document.addEventListener('DOMContentLoaded', function () {
      var input = document.getElementById('paletteInput');
      if (input) input.addEventListener('input', function () { filterPalette_(this.value); });
      var hint = document.getElementById('paletteKeyHint');
      if (hint && !isMac_()) hint.textContent = 'Ctrl K';
    });

    /* ===================== SETUP CONTROLS ===================== */

    function submitTeamId(inputId) {
      var val = document.getElementById(inputId || 'teamIdInput').value.trim();
      // Header "Refresh" button with an unchanged/blank field just reloads current data
      // rather than erroring — only a genuinely new ID goes through saveTeamId.
      if (!inputId && (!val || (STATE.data && val === String(STATE.data.teamId)))) {
        loadDashboard(true);
        return;
      }
      google.script.run.withSuccessHandler(function () { loadDashboard(); })
        .withFailureHandler(function (err) {
          var errEl = document.getElementById('setupError');
          if (errEl) errEl.textContent = err.message || err;
        })
        .saveTeamId(val);
    }

    document.getElementById('riskSelect').addEventListener('change', function () {
      google.script.run.withFailureHandler(function () {}).saveRiskAppetite(this.value);
      loadDashboard();
    });

    loadDashboard();
  </script>
</body>
</html>
